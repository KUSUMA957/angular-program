<div style="padding: 20px; max-width: 600px; margin: 0 auto;">
  <h1>Angular Services Demo</h1>
  
  <div style="background: #f5f5f5; padding: 15px; margin: 20px 0; border-radius: 5px;">
    <h2>Users ({{ userService.getUserCount() }})</h2>
    <div *ngFor="let user of userService.getUsers()" style="margin: 5px 0;">
      {{ user.name }} - {{ user.email }}
    </div>
  </div>
  
  <div style="background: #e8f4fd; padding: 15px; margin: 20px 0; border-radius: 5px;">
    <h3>Add User</h3>
    <input [(ngModel)]="userName" placeholder="Name" style="margin: 5px; padding: 5px;">
    <input [(ngModel)]="userEmail" placeholder="Email" style="margin: 5px; padding: 5px;">
    <button (click)="addUser()" style="margin: 5px; padding: 5px 15px;">Add</button>
    <button (click)="clearUsers()" style="margin: 5px; padding: 5px 15px;">Clear All</button>
  </div>
</div>
