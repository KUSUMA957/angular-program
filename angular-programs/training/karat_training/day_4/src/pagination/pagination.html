<div>
    <p>Posts: </p>
    <ul>
        <div *ngFor="let post of pagedPosts">
        {{ post.id }} - {{post.title}}
  </div>
    </ul>
  <div>
    <button (click)="prevPage()" [disabled]="page === 1">
      Previous
    </button>
    <span>
      Page {{ page }} of {{ totalPages }}
    </span>
    <button (click)="nextPage()" [disabled]="page === totalPages">
      Next
    </button>
  </div>
</div>
