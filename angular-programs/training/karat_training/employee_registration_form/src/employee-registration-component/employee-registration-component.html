<form [formGroup]="employeeForm" (ngSubmit)="submitForm()">
  <div>
    <label>Name</label><br>
    <input type="text" formControlName="name">
    <p *ngIf="employeeForm.get('name')?.touched && employeeForm.get('name')?.invalid">
      Name is required
    </p>
  </div>
  <div>
    <label>Email</label><br>
    <input type="email" formControlName="email">
    <p *ngIf="employeeForm.get('email')?.touched && employeeForm.get('email')?.invalid">
      Enter a valid email
    </p>
  </div>
  <div>
    <label>Password</label><br>
    <input type="password" formControlName="password">
    <p *ngIf="employeeForm.get('password')?.touched && employeeForm.get('password')?.invalid">
      Password must be at least 6 characters
    </p>
  </div>
  <div>
    <label>Department</label><br>
    <input type="text" formControlName="department">
    <p *ngIf="employeeForm.get('department')?.touched && employeeForm.get('department')?.invalid">
      Department is required
    </p>
  </div>
  <button type="submit" [disabled]="employeeForm.invalid">
    Register
  </button>
</form>
