<div class="form-container">
  <h2>User Registration Form</h2>
  
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">
    
    <!-- Name Field -->
    <div class="form-group">
      <label for="name">Name:</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name" 
        class="form-control"
        [class.invalid]="name?.invalid && name?.touched"
        placeholder="Enter your name">
      
      <div class="error-messages" *ngIf="name?.invalid && name?.touched">
        <div *ngIf="name?.errors?.['required']">Name is required</div>
        <div *ngIf="name?.errors?.['minlength']">Name must be at least 2 characters long</div>
      </div>
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        class="form-control"
        [class.invalid]="email?.invalid && email?.touched"
        placeholder="Enter your email">
      
      <div class="error-messages" *ngIf="email?.invalid && email?.touched">
        <div *ngIf="email?.errors?.['required']">Email is required</div>
        <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="form-group">
      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="userForm.invalid">
        Submit
      </button>
    </div>

  </form>

  <!-- Form Status Display -->
  <div class="form-status">
    <p><strong>Form Status:</strong> {{ userForm.valid ? 'Valid' : 'Invalid' }}</p>
    <p><strong>Form Value:</strong></p>
    <pre>{{ userForm.value | json }}</pre>
  </div>
</div>
