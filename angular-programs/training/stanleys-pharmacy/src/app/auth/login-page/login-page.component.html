<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-3">Stanley's Pharmacy</h2>

  <div class="card p-3">
    <h4>Login</h4>

    <input class="form-control mb-2" placeholder="Email" [(ngModel)]="email">
    <input class="form-control mb-2" placeholder="Password" type="password" [(ngModel)]="password">

    <button class="btn btn-primary w-100" (click)="login()">Login</button>

    <p class="text-danger mt-2" *ngIf="error()">{{ error() }}</p>

    <a class="btn btn-link mt-2" routerLink="/signup">New user? Signup</a>
  </div>
</div>
