<div>
  <h1>Parent Component</h1>
  <h2>Parent-Child Data Binding with @Input</h2>
  
  <div>
    <h3>Parent Data:</h3>
    <p>Message: {{ parentMessage }}</p>
    <p>Number: {{ parentNumber }}</p>
    <p>User: {{ parentUser.name }} ({{ parentUser.age }} years old)</p>
    
    <div>
      <button (click)="updateMessage()">Update Message</button>
      <button (click)="updateNumber()">Update Number</button>
      <button (click)="updateUser()">Update User</button>
    </div>
  </div>

  <hr>

  <!-- Child component with @Input binding -->
  <app-child 
    [message]="parentMessage"
    [number]="parentNumber"
    [user]="parentUser">
  </app-child>

  
</div>
