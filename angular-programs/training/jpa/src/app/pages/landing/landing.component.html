<div class="container">

  <!-- Search bar -->
  <input class="search" placeholder="Find jobs" />

  <!-- Image -->
  <img class="hero" src="" alt="Landing page image"/>

  <!-- Buttons -->
  <div class="btn-group">
    <button (click)="openLogin()">Login</button>
    <button (click)="openRegister()">Register</button>
  </div>

  <!-- Messages -->
  <p class="msg success" *ngIf="message">{{ message }}</p>
  <p class="msg error" *ngIf="error">{{ error }}</p>

  <!-- LOGIN FORM -->
  <div *ngIf="showLoginForm" class="form">
    <h3>Login</h3>
    <input [(ngModel)]="loginEmail" placeholder="Email" />
    <input [(ngModel)]="loginPassword" type="password" placeholder="Password" />
    <button (click)="login()">Login</button>
  </div>

  <!-- REGISTER FORM -->
  <div *ngIf="showRegisterForm" class="form">
    <h3>Register</h3>
    <input [(ngModel)]="name" placeholder="Name" />
    <input [(ngModel)]="email" placeholder="Email" />
    <input [(ngModel)]="password" type="password" placeholder="Password" />
    <input [(ngModel)]="confirmPassword" type="password" placeholder="Confirm Password" />
    <button (click)="register()">Register</button>
  </div>

</div>
