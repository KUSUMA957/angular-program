<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Container Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .box {
      padding: 20px;
      color: white;
      font-weight: bold;
      font-size: 20px;
    }
    .container-demo {
      background: rgba(255, 0, 0, 0.4); /* light red */
      border: 2px solid red;
    }
    .fluid-demo {
      background: rgba(0, 255, 0, 0.4); /* light green */
      border: 2px solid green;
    }
  </style>
</head>
<body>

  <h2>.container (RED) – fixed width, changes at breakpoints</h2>
  <div class="container container-demo box">
    I am a .container  
    <br>(See the empty space on sides)
  </div>

  <hr>

  <h2>.container-fluid (GREEN) – always 100% width</h2>
  <div class="container-fluid fluid-demo box">
    I am a .container-fluid  
    <br>(Always full width)
  </div>

</body>
</html>
