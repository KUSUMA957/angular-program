<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bootstrap Dropdown Demo</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
<div class="container my-5">

  <h2 class="mb-4">Bootstrap Dropdown Demo</h2>

  <!-- BASIC DROPDOWN -->
  <div class="dropdown mb-4">
    <button class="btn btn-primary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
      Simple Dropdown
    </button>

    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Action</a></li>
      <li><a class="dropdown-item" href="#">Another action</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item" href="#">Something else</a></li>
    </ul>
  </div>

  <!-- SPLIT BUTTON DROPDOWN -->
  <div class="btn-group mb-4">
    <button class="btn btn-success" type="button">Main Button</button>
    <button class="btn btn-success dropdown-toggle dropdown-toggle-split"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
      <span class="visually-hidden">Toggle Dropdown</span>
    </button>

    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Action</a></li>
      <li><a class="dropdown-item" href="#">Another action</a></li>
    </ul>
  </div>

  <!-- DARK DROPDOWN -->
  <div class="dropdown mb-4">
    <button class="btn btn-dark dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
      Dark Dropdown
    </button>

    <ul class="dropdown-menu dropdown-menu-dark">
      <li><a class="dropdown-item" href="#">Action</a></li>
      <li><a class="dropdown-item" href="#">Another action</a></li>
    </ul>
  </div>

  <!-- DROPUP -->
  <div class="btn-group dropup mb-4">
    <button class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
      Dropup
    </button>

    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Up Action</a></li>
    </ul>
  </div>

  <!-- DROPRIGHT (dropend) -->
  <div class="btn-group dropend mb-4">
    <button class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
      Dropright
    </button>

    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Right Action</a></li>
    </ul>
  </div>

  <!-- DROPLEFT (dropstart) -->
  <div class="btn-group dropstart mb-4">
    <button class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
      Dropleft
    </button>

    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Left Action</a></li>
    </ul>
  </div>

</div>

<!-- ✅ Bootstrap 5 JS Bundle (includes Popper) — REQUIRED for dropdowns -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
