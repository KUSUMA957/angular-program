<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Gutter Demo</title>
  <style>
    .demo-box { background: #6c63ff; color: white; padding: 20px; text-align:center; }
  </style>
</head>
<body>

<div class="container my-4">

  <h2 class="mb-4">Bootstrap Form Demo</h2>

  <form>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
      <div id="emailHelp" class="form-text">
        We'll never share your email with anyone else.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="form-label" for="pass">Password</label>
      <input type="password" class="form-control" id="pass">
    </div>

    <!-- Checkbox -->
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="checkMe">
      <label class="form-check-label" for="checkMe">Remember me</label>
    </div>

    <!-- Select -->
    <div class="mb-3">
      <label class="form-label">Choose an option</label>
      <select class="form-select">
        <option selected>Option 1</option>
        <option>Option 2</option>
      </select>
    </div>

    <!-- Input group -->
    <div class="mb-3">
      <label class="form-label">Username (input group)</label>
      <div class="input-group">
        <span class="input-group-text">@</span>
        <input type="text" class="form-control" placeholder="Username">
      </div>
    </div>

    <!-- Floating label -->
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="floatingInput" placeholder="John">
      <label for="floatingInput">Your Name</label>
    </div>

    <!-- Disabled field -->
    <input type="text" class="form-control mb-3" placeholder="Disabled input" disabled>

    <!-- Submit -->
    <button class="btn btn-primary" type="submit">Submit</button>

  </form>

</div>
</body>
</html>
