<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tooltip Demo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

  <h2 class="mb-4">Bootstrap Tooltip Demo</h2>

  <!-- Basic tooltip -->
  <a href="#" data-bs-toggle="tooltip" title="Hello tooltip!">Hover me</a>

  <!-- Tooltip placements -->
  <div class="mt-4">
    <button class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Tooltip on top">Top</button>
    <button class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="right" title="Tooltip on right">Right</button>
    <button class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Tooltip on bottom">Bottom</button>
    <button class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="left" title="Tooltip on left">Left</button>
  </div>

  <!-- Tooltip with HTML -->
  <div class="mt-4">
    <button class="btn btn-primary"
            data-bs-toggle="tooltip"
            data-bs-html="true"
            title="<b>Bold</b> and <u>underlined</u> tooltip">
      Tooltip with HTML
    </button>
  </div>

  <!-- Disabled element tooltip (wrapped) -->
  <div class="mt-4">
    <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Disabled button tooltip">
      <button class="btn btn-danger" disabled>Disabled button</button>
    </span>
  </div>

  <!-- Bootstrap 5 JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Enable all tooltips on the page
    document.querySelectorAll('[data-bs-toggle="tooltip"]')
      .forEach(el => new bootstrap.Tooltip(el));
  </script>
</body>
</html>
