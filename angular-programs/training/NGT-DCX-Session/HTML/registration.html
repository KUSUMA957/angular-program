<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body style="font-family: Arial, sans-serif; background:#eef2f3; padding:30px;">
    <h2 style="text-align:center; color:#333;">Registration Form</h2>
    <div style="width:100vh; margin: auto; background:white; padding:25px; border-radius:10px; ">
        <form>
            <label style="font-weight:bold;">Full Name</label>
            <input type="text" placeholder="Enter full name" required style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px;">
            <label style="font-weight:bold;">Email</label>
            <input type="email" placeholder="Enter email" required style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px;">
            <label style="font-weight:bold;">Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px;">
            <label style="font-weight:bold;">Gender</label><br>
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label style="margin-left:15px;"><input type="radio" name="gender" value="female"> Female</label>
            <label style="margin-left:15px;"><input type="radio" name="gender" value="other"> Other</label>
            <br><br>
            <label style="font-weight:bold;">Date of Birth</label>
            <input type="date" required style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px;">
            <label style="font-weight:bold;">Address</label>
            <textarea placeholder="Enter your address" required style="width:100%; height:70px; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px;"></textarea>
            <button type="submit"style=" width:100%;  padding:12px;  background:#4CAF50;  color:white;  border:none;  border-radius:5px;  font-size:16px; cursor:pointer;">
                Register
            </button>
        </form>
    </div>
</body>
</html>
