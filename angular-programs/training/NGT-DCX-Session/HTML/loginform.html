<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="margin:auto; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#888; font-family:Arial, sans-serif;">
    <div style="width:300px; background:#f7f7fb; padding:20px; border-radius:8px; text-align:center;">
        <h2 style="background:#e52e71; color:white; padding:10px 0; border-radius:6px;">Login</h2>
        <label style="display:block; margin-top:15px; font-weight:bold;">Username:</label>
        <input type="text" placeholder="Enter username"style="width:80%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        <label style="display:block; margin-top:15px; font-weight:bold;">Password:</label>
        <input type="password" placeholder="Enter password"style="width:80%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        <button  style="margin-top:20px; width:60%; padding:10px; background:#e52e71; color:white; border:none; border-radius:4px; cursor:pointer;">
            Login
        </button>
    </div>
</body>
</html>
