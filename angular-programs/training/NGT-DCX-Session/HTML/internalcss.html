<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .blue  { background-color: lightblue;  padding: 10px; border-radius: 6px; }
    .green { background-color: lightgreen; padding: 10px; border-radius: 6px; }
    h2 { margin-bottom: 12px; }
    h3 { margin-top: 0; }
    ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
  <h2>Example of Div Tag</h2>
  <div class="blue">
    <p>Courses</p>
  </div>
  <div class="green">
    <h3>Here are the courses</h3>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JS</li>
    </ul>
  </div>
</body>
</html>
